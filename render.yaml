services:
  # PulseIoT Energy Monitor - Complete Web + Real-Time Telemetry Pipeline
  - type: web
    name: pulseiot-energy-monitor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_MODE
        value: "false"
      - key: MQTT_HOST
        value: "broker.hivemq.com"
      - key: MQTT_PORT
        value: "1883"
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycbxwqlBZPsX6Mi0iyJWtiwra6S_pWYUDzfmpeoekIyOQU1c8HkBxVuj5BZvBI0h5YfEv1Q/exec"
